<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fintech Survey</title><style>body{font:16px system-ui;background:#f4f6fb;color:#172033}.card{max-width:760px;margin:30px auto;padding:26px;background:#fff;border-radius:16px}fieldset{border:0;border-top:1px solid #ddd;padding:18px 0}label{display:block;margin:7px 0}.text{width:100%;padding:10px;box-sizing:border-box}.scale{display:flex;gap:6px}.scale input{position:absolute;opacity:0}.scale span{display:grid;place-items:center;width:34px;height:34px;border:1px solid #bbc;border-radius:5px}.scale input:checked+span{background:#2457d6;color:#fff}.msg{padding:10px;margin-top:14px}.success{background:#e9f8ef}.error{background:#fee}.submit{padding:11px 20px;background:#2457d6;color:#fff;border:0;border-radius:7px}</style><main class="card"><h1>Adoption of Fintech Apps Among University Students in Pakistan</h1><p>Required fields are marked *.</p><form id="f"></form><div id="m"></div></main><script>

f.insertAdjacentHTML('beforeend','<button class=submit>Submit survey</button>');f.addEventListener('submit',async e=>{e.preventDefault();let d={},bad=false;f.querySelectorAll('fieldset').forEach(q=>{let a=[...q.querySelectorAll('input,select,textarea')],x=a.filter(i=>i.checked),v=q.querySelector('select,textarea')?.value||a.find(i=>!['radio','checkbox'].includes(i.type))?.value||x[0]?.value||'';if(q.dataset.r==='1'&&(!v||(a[0]?.type==='checkbox'&&!x.length)))bad=true;d[q.dataset.n]=a[0]?.type==='checkbox'?x.map(i=>i.value).join(', '):v});if(bad){m.className='msg error';m.textContent='Please complete all required questions.';return}let b=f.querySelector('button');b.disabled=true;b.textContent='Sending…';try{if(API_URL.includes('PASTE_'))throw Error();await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)});f.reset();m.className='msg success';m.textContent='Thank you—your response was submitted successfully.'}catch(e){m.className='msg error';m.textContent='Could not submit. Check the Web App URL.'}finally{b.disabled=false;b.textContent='Submit survey'}});</script>
